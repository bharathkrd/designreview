# Provider routing for agentkit/llm/gateway.py (validated by a pydantic model).
#
# A tier's providers are tried top to bottom. A provider is skipped when its
# API key env var is unset, or while it is cooling down after failures.
# `model` is the default; `model_env` (if set in the environment) overrides it,
# so a model can be changed in .env without editing this file.
#
# Model ids checked 2026-09-28 against each provider's /models list (groq and
# cerebras no longer serve llama-3.3-70b; nvidia retired meta/llama-3.3-70b-instruct
# on 2026-08-26). Anthropic: claude-opus-5 is the default current model; this
# project's .env pins ANTHROPIC_MODEL=claude-sonnet-4-6.
#
# A row with `url` (and optionally `url_env`) is any OpenAI-compatible endpoint: no code change
# needed. DeepSeek, Moonshot (Kimi) and LM Studio are such rows; their model ids were read from
# each one's /models list on 2026-10-14 (deepseek: deepseek-v4-pro, deepseek-flash; moonshot:
# kimi-k2.6, kimi-k3; LM Studio: whatever is loaded locally).

[[providers]]
name = "deepseek"
model = "deepseek-v4-pro"
model_env = "DEEPSEEK_MODEL"
key_env = "DEEPSEEK_API_KEY"
url = "https://api.deepseek.com"
url_env = "DEEPSEEK_API_URL"
rpm = 60
timeout = 120

[[providers]]
name = "deepseek_flash"     # same key, the cheap fast model: first in the `fast` tier (cascade drafts)
model = "deepseek-flash"
model_env = "DEEPSEEK_FLASH_MODEL"
key_env = "DEEPSEEK_API_KEY"
url = "https://api.deepseek.com"
url_env = "DEEPSEEK_API_URL"
rpm = 60

[[providers]]
name = "moonshot"
model = "kimi-k2.6"
model_env = "MOONSHOT_MODEL"
key_env = "MOONSHOT_API_KEY"
url = "https://api.moonshot.ai/v1"
url_env = "MOONSHOT_API_URL"
temperature = 1         # kimi-k2.6 rejects any other value (HTTP 400, 2026-10-14)
rpm = 30
timeout = 120

[[providers]]
name = "gemini"
model = "gemini-2.5-flash"
model_env = "GEMINI_MODEL"
key_env = "GEMINI_API_KEY"
rpm = 60

[[providers]]
name = "groq"
model = "openai/gpt-oss-120b"
model_env = "GROQ_MODEL"
key_env = "GROQ_API_KEY"
rpm = 30

[[providers]]
name = "cerebras"
model = "gpt-oss-120b"
model_env = "CEREBRAS_MODEL"
key_env = "CEREBRAS_API_KEY"
rpm = 30

[[providers]]
name = "anthropic"
model = "claude-opus-5"
model_env = "ANTHROPIC_MODEL"
key_env = "ANTHROPIC_API_KEY"
rpm = 50
timeout = 120

[[providers]]
name = "nvidia"
model = "mistralai/mistral-large-2-instruct"
model_env = "NVIDIA_MODEL"
key_env = "NVIDIA_API_KEY"
rpm = 30

[[providers]]
name = "openrouter"
model = "meta-llama/llama-3.3-70b-instruct"
model_env = "OPENROUTER_MODEL"
key_env = "OPEN_ROUTER_API_KEY"
rpm = 20

[[providers]]
name = "ollama"
model = "gemma:latest"
model_env = "OLLAMA_MODEL"
keyless = true          # local, no API key
rpm = 120
timeout = 180

[[providers]]
name = "lmstudio"
model = "google/gemma-4-e4b"
model_env = "LMSTUDIO_MODEL"
keyless = true          # local LM Studio server, no API key
url = "http://127.0.0.1:1235/v1"
url_env = "LMSTUDIO_URL"
rpm = 120
timeout = 180

[tiers]
# DeepSeek and Moonshot (Kimi) first; the earlier hosted providers next; local LM Studio, then Ollama, last.
default = ["deepseek", "moonshot", "gemini", "groq", "cerebras", "anthropic", "nvidia", "openrouter", "lmstudio", "ollama"]
# Cheap/fast tier for high-volume, low-stakes calls (cascade drafts, the eval judge).
fast = ["deepseek_flash", "moonshot", "groq", "cerebras", "gemini", "nvidia", "lmstudio", "ollama"]
# Quality tier for the final answer.
quality = ["deepseek", "moonshot", "anthropic", "gemini", "openrouter", "nvidia", "lmstudio", "ollama"]
