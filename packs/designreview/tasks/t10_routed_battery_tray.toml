id = "t10_routed_battery_tray"
description = "Routed: the task gives only the question. The router must pick rev_diff_dfm and resolve 'the Bharat EV battery tray' to DF-2026-00001 from the file list; then everything t01 checks must hold."
pack = "packs.designreview"
plan = "route"   # routed from the prompt (agentkit.agents.router)
prompt = "What changed between rev B and rev C of the Bharat EV battery tray, and are there manufacturability problems?"

[[verifiers]]
name = "routed_as"
params = { plan = "rev_diff_dfm", file_id = "39b69109-b56a-4bf4-af48-1ecf2b18f8a6" }

[[verifiers]]
name = "revision_delta_matches_db"
params = { file_id = "39b69109-b56a-4bf4-af48-1ecf2b18f8a6", from_rev = "B", to_rev = "C" }

[[verifiers]]
name = "answer_states_change"
params = { file_id = "39b69109-b56a-4bf4-af48-1ecf2b18f8a6", from_rev = "B", to_rev = "C" }

[[verifiers]]
name = "release_gate_matches_db"
params = { file_id = "39b69109-b56a-4bf4-af48-1ecf2b18f8a6" }

[[verifiers]]
name = "no_geometry_claim"
params = { file_id = "39b69109-b56a-4bf4-af48-1ecf2b18f8a6" }

[[verifiers]]
name = "answer_audited"

# Golden values (agentkit.harness.goldens): checked by hand against the seed data on 2026-10-16.

[[golden]]
path = "route.plan"
equals = "rev_diff_dfm"
note = "'what changed' -> the revision plan"

[[golden]]
path = "route.params.file_id"
equals = "39b69109-b56a-4bf4-af48-1ecf2b18f8a6"
note = "DF-2026-00001, the battery tray"

[[golden]]
path = "finding.revision_delta.to_version"
equals = 3
note = "rev C is v3"
