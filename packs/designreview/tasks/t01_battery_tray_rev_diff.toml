id = "t01_battery_tray_rev_diff"
description = "The seat's core question on the one file with a real rev history. Rev B is v2, rev C is v3; rev C's note carries 2.0 mm -> 3.0 mm bend radius and 4.2 mm blank growth; the release gate is NOT ready with a critical blocker."
pack = "packs.designreview"
plan = "rev_diff_dfm"
prompt = "What changed between rev B and rev C, and are there manufacturability problems in this part?"
params = { file_id = "39b69109-b56a-4bf4-af48-1ecf2b18f8a6" }

[[verifiers]]
name = "revision_delta_matches_db"
params = { file_id = "39b69109-b56a-4bf4-af48-1ecf2b18f8a6", from_rev = "B", to_rev = "C" }

[[verifiers]]
name = "answer_states_change"
params = { file_id = "39b69109-b56a-4bf4-af48-1ecf2b18f8a6", from_rev = "B", to_rev = "C" }

[[verifiers]]
name = "release_gate_matches_db"
params = { file_id = "39b69109-b56a-4bf4-af48-1ecf2b18f8a6" }

[[verifiers]]
name = "no_geometry_claim"
params = { file_id = "39b69109-b56a-4bf4-af48-1ecf2b18f8a6" }

[[verifiers]]
name = "cited_standards_exist"

[[verifiers]]
name = "answer_audited"

[[verifiers]]
name = "answer_reflects_change_notes"
params = { file_id = "39b69109-b56a-4bf4-af48-1ecf2b18f8a6", from_rev = "B", to_rev = "C" }

# Golden values (agentkit.harness.goldens): checked by hand against the seed data on 2026-10-16.

[[golden]]
path = "finding.revision_delta.from_version"
equals = 2
note = "rev B is v2 (DesignVersion v2 note starts 'Rev B')"

[[golden]]
path = "finding.revision_delta.to_version"
equals = 3
note = "rev C is v3 (v3 note starts 'Rev C')"

[[golden]]
path = "finding.revision_delta.versions[rev=C].quantities"
field = "text"
values = ["2.0 mm", "3.0 mm", "4.2 mm"]
note = "the quantities of the v3 (rev C) note"

[[golden]]
path = "finding.release_gate.ready"
equals = false
note = "release_readiness: ready false"

[[golden]]
path = "finding.release_gate.critical_open"
equals = 1
note = "release_readiness: critical_open 1"

[[golden]]
answer_contains = ["3.0 mm", "4.2 mm"]
note = "the answer states the rev C change"
