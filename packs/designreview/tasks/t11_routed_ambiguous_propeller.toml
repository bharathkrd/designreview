id = "t11_routed_ambiguous_propeller"
description = "Routed refusal: 'the propeller' matches four design files and the question names no revision to narrow it. Correct = decline, naming the candidates and asking for the part number -- never pick one."
pack = "packs.designreview"
plan = "route"   # routed from the prompt (agentkit.agents.router)
prompt = "Is the propeller ready for release?"

[[verifiers]]
name = "routed_as"
params = { declined_because = "ambiguous" }

[[verifiers]]
name = "answer_audited"

# Golden values (agentkit.harness.goldens): checked by hand against the seed data on 2026-10-16.

[[golden]]
path = "route.plan"
equals = "route_declined"
note = "'the propeller' matches four files"

[[golden]]
path = "route.params.reason"
contains = "4 design files"
note = "the decline names how many"

[[golden]]
path = "finding.outcome"
equals = "declined"
note = "no guess"
