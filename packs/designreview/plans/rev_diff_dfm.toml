# "What changed between rev B and rev C, and are there manufacturability
# problems in this part?" -- evidence-gathering plan.
#
# The file is read first: if it doesn't exist (or isn't visible), every other
# read is BYPASSED and the run ends as one clean refusal instead of half-empty
# evidence. The other reads then run in parallel. If the release gate reports
# any blocker or reason code, the planner adds one follow-up read of the
# failed DFM checklist results. If the release gate cannot be read at all
# (FAILED after its retries), a fallback rule adds the same read: the verdict
# stays unknown -- nothing stands in for the gate -- but the answer still has
# the failed checks as DFM evidence.

name = "rev_diff_dfm"
params = ["file_id"]

[[nodes]]
id = "design_file"
action = "load_design_file"
args = { file_id = "{file_id}" }

[[nodes]]
id = "revisions"
action = "list_revisions"
after = ["design_file"]
args = { file_id = "{file_id}" }

[[nodes]]
id = "release_gate"
action = "read_release_gate"
after = ["design_file"]
args = { file_id = "{file_id}" }

[[nodes]]
id = "feedback"
action = "list_feedback"
after = ["design_file"]
args = { file_id = "{file_id}" }

# Recall the company's DesignStandard records relevant to the change notes
# and the release blockers. It waits for BOTH reads: the query used to take the
# blockers only "if the gate had answered by then", so which standards were
# cited depended on thread timing.
[[nodes]]
id = "dfm_standards"
action = "gather_dfm_standards"
after = ["revisions", "release_gate"]

[[rules]]
name = "failed_checklists_when_gate_blocked"

[rules.when]
node = "release_gate"
verdict = "resolved"
nonempty = ["result.blockers", "result.reason_codes"]

[[rules.add]]
id = "failed_checklists"
action = "list_failed_checklists"
args = { file_id = "{file_id}" }
after = ["release_gate"]

# Fallback (replanning on failure): the gate is unreadable, so read the failed checks anyway.
# requires = "settled": the read waits for the gate to finish, whatever its verdict.
[[rules]]
name = "failed_checklists_when_gate_unreadable"

[rules.when]
node = "release_gate"
verdict = "failed"

[[rules.add]]
id = "failed_checklists"
action = "list_failed_checklists"
args = { file_id = "{file_id}" }
after = ["release_gate"]
requires = "settled"
